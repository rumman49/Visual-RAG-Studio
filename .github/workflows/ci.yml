name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_providers:
        description: "Also run tests marked live_providers (needs provider keys as repo secrets)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check
      - name: Pytest (live_providers excluded)
        if: ${{ !inputs.live_providers }}
        run: uv run pytest -m "not live_providers"
      - name: Pytest (live_providers opted in)
        if: ${{ inputs.live_providers }}
        run: uv run pytest

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
